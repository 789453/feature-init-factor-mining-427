# 轻量级配置，用于测试和快速运行
base_config:
  duckdb_path: data/market.duckdb
  forward_days: 5
  train_end: "20250831"
  test_start: "20250901"
  windows: [10, 20, 30]
  batch_size: 64
  write_every: 50
  progress_min_interval_sec: 30
  seed: 42
  extended_attribution: true
  ranking_strategy: interleave

template_config_path: configs/phase2/templates_light.yaml

candidate_selection:
  top_k: 500
  sample_n: 500
  min_per_family: 50
  min_per_field: 10
  min_per_operator: 10
  alpha: 0.85

phase_config:
  coarse:
    pool_json: static_pool_200.json
    start: "20240101"
    end: "20240430"  # 只使用4个月数据进行快速测试
    max_exprs: 10000
    out_dir: outputs/phase2_light/coarse_200_2024
    phase_type: coarse
    top_n_display: 50
    
  fine:
    pool_json: static_pool_800.json
    start: "20240101"
    end: "20240430"
    max_exprs: 5000
    out_dir: outputs/phase2_light/fine_800_2024
    phase_type: fine
    top_n_display: 50