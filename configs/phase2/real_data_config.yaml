# 真实数据配置，使用现有DuckDB文件
base_config:
  duckdb_path: outputs/full_run_phase2/phase2_results.duckdb  # 使用现有的DuckDB文件
  use_simulated: false  # 使用真实数据
  forward_days: 5
  train_end: "20250831"
  test_start: "20250901"
  windows: [10, 20, 30, 40, 50]
  batch_size: 64
  write_every: 200
  progress_min_interval_sec: 30
  seed: 42
  extended_attribution: true
  ranking_strategy: interleave

template_config_path: configs/phase2/templates_v1.yaml

candidate_selection:
  top_k: 1000
  sample_n: 1000
  min_per_family: 100
  min_per_field: 20
  min_per_operator: 20
  alpha: 0.85

phase_config:
  coarse:
    pool_json: static_pool_200.json
    start: "20240101"
    end: "20240430"  # 4个月数据
    max_exprs: 50000
    out_dir: outputs/phase2_real/coarse_200_2024
    phase_type: coarse
    top_n_display: 100
    
  fine:
    pool_json: static_pool_800.json
    start: "20240101"
    end: "20240430"
    max_exprs: 20000
    out_dir: outputs/phase2_real/fine_800_2024
    phase_type: fine
    top_n_display: 100