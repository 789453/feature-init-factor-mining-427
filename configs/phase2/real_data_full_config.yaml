# 真实数据完整配置 - 用于生产环境
base_config:
  duckdb_path: outputs/full_run_phase2/phase2_results.duckdb  # 使用最大的真实数据集
  use_simulated: false  # 强制使用真实数据
  forward_days: 5
  train_end: "20250831"
  test_start: "20250901"
  windows: [10, 20, 30, 40, 50]
  batch_size: 64
  write_every: 200
  progress_min_interval_sec: 30
  seed: 42
  extended_attribution: true
  ranking_strategy: interleave

template_config_path: configs/phase2/templates_v1.yaml

candidate_selection:
  top_k: 2000
  sample_n: 2000
  min_per_family: 200
  min_per_field: 50
  min_per_operator: 50
  alpha: 0.85

phase_config:
  coarse:
    pool_json: static_pool_200.json
    start: "20240101"
    end: "20240630"  # 6个月真实数据
    max_exprs: 100000
    out_dir: outputs/phase2_real_prod/coarse_200_2024
    phase_type: coarse
    top_n_display: 200
    
  fine:
    pool_json: static_pool_800.json
    start: "20240101"
    end: "20240630"
    max_exprs: 50000
    out_dir: outputs/phase2_real_prod/fine_800_2024
    phase_type: fine
    top_n_display: 200